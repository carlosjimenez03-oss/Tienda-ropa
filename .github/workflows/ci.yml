name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  calidad:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventario
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/inventario_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Crear base de pruebas
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'create database inventario_test'
      - name: Tests unitarios y de API
        run: npm test
      - name: Build
        run: npm run build
      - name: Sin secretos en el bundle
        run: |
          if grep -rEi "BEGIN PRIVATE KEY|POSTGRES_PASSWORD|ADMIN_PASSWORD|DATABASE_URL" dist/; then
            echo "Se encontró un posible secreto en el bundle del navegador" && exit 1
          fi
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Tests E2E
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/inventario
          PUBLIC_URL: http://localhost:3000
          ADMIN_EMAIL: admin@tienda.test
          ADMIN_PASSWORD: contrasena-segura-1
          LOGIN_RATE_LIMIT: '1000'
          UPLOADS_DIR: /tmp/subidas
        run: |
          npm start > servidor.log 2>&1 &
          npx wait-on -t 60000 http://localhost:3000/api/salud
          npm run test:e2e
      - name: Logs del servidor
        if: failure()
        run: cat servidor.log || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imágenes
        run: |
          docker build -t inventario-app .
          docker build -f Dockerfile.backup -t inventario-backup .
